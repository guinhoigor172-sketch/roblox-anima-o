<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Quita Score</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f5f9;color:#1e293b}header{background:#071d41;color:#fff;padding:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{margin:0 20px 0 0;font-size:22px}input,button{height:40px;border-radius:4px;border:1px solid #94a3b8;padding:8px 12px}header button{color:#fff;font-weight:700;cursor:pointer}#go{background:#1351b4;border-color:#1351b4}main{padding:24px}.src{color:#64748b}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #cbd5e1;padding:10px;text-align:left}th{background:#e2e8f0}</style></head>
<body><header><h1>Quita Score — painel</h1><input id="pass" type="password" placeholder="senha do painel" autocomplete="current-password"><button id="go">Carregar do banco</button><button id="local" style="background:#475569;border-color:#475569">Ver deste navegador</button><button id="csv" style="background:#166534;border-color:#166534">Exportar CSV</button><button id="limpar" style="background:#7f1d1d;border-color:#7f1d1d">Limpar local</button></header><main><p id="status" class="src">Este painel é demonstrativo. Nenhum banco está configurado.</p><div style="overflow:auto"><table id="tbl"><thead><tr><th>Nome</th><th>CPF</th><th>Valor</th><th>Cartão</th><th>Data</th></tr></thead><tbody></tbody></table></div></main><script>const body=document.querySelector('#tbl tbody'),status=document.querySelector('#status');const get=()=>JSON.parse(localStorage.getItem('quita-simulacoes')||'[]');document.getElementById('local').onclick=()=>{const rows=get();body.innerHTML=rows.map(r=>`<tr><td>${r.name||'-'}</td><td>${r.cpf||'-'}</td><td>${r.value||'-'}</td><td>•••• ${String(r.card||'').slice(-4)}</td><td>${r.date||'-'}</td></tr>`).join('');status.textContent=rows.length?`${rows.length} registro(s) encontrado(s).`:'Nenhum registro neste navegador.'};document.getElementById('limpar').onclick=()=>{localStorage.removeItem('quita-simulacoes');body.innerHTML='';status.textContent='Dados locais removidos.'};document.getElementById('csv').onclick=()=>{const rows=get();if(!rows.length)return alert('Não há dados para exportar.');const csv=['Nome,CPF,Valor,Cartao,Data',...rows.map(r=>`"${r.name||''}","${r.cpf||''}","${r.value||''}","${r.card||''}","${r.date||''}"`)].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='quita-score.csv';a.click()};document.getElementById('go').onclick=()=>status.textContent='Nenhuma integração com banco foi configurada neste protótipo.';</script></body></html>
